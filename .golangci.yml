version: "2"
run:
  go: "1.27"
  modules-download-mode: readonly
linters:
  default: standard
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - copyloopvar
    - decorder
    - errchkjson
    - errname
    - exhaustive
    - exptostd
    - forcetypeassert
    - misspell
    - nolintlint
    - unconvert
    - whitespace

    - modernize
    - thelper
    - usestdlibvars

  settings:
    exhaustive:
      default-signifies-exhaustive: true
    nolintlint:
      require-specific: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      # secp256k1 keys: the stdlib raw-key replacements support only NIST curves
      - linters: [staticcheck]
        text: 'SA1019: \(crypto/ecdsa\.(PublicKey|PrivateKey)\)\.[XYD] has been deprecated'
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-same-issues: 3
